# Switrus User Management backend: API (port 8001, as before) and the Loyaltri
# sync worker. The worker is a separate process: if Loyaltri hangs or the
# worker crashes, the API is unaffected.
services:
  api:
    build: .
    env_file: .env
    environment:
      LOYALTRI_SCHEDULER: external   # syncs run in sync-worker, not in the API
    ports:
      - "8001:8001"                  # the UI's nginx and existing integrations (CRM, accounting) use this
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped

  sync-worker:
    build: .
    env_file: .env
    command: ["python", "-m", "services.loyaltri.loyaltri_scheduler"]
    volumes:
      - ./logs:/app/logs
    healthcheck:
      disable: true
    restart: unless-stopped
